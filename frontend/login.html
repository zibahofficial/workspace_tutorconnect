<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — TutorConnect</title>
<meta name="description" content="Sign in to TutorConnect to manage tutor requests, bookings and your profile." />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3ETC%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<style>
  /* stats strip removed — keep the hero text from feeling cramped (+40px) */
  .auth-media { padding-bottom: 84px; }
  @media (max-width: 940px) {
    .auth-media { padding-bottom: 64px; }
  }
  /* sign-in meta row: role dropdown | prompt | create-account link,
     spanning exactly the width of the blue Sign in button above it */
  .auth-alt-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px 14px;
    width: 100%;
    margin: 18px 0 0;
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .auth-alt-row .alt-left { justify-self: start; display: inline-flex; align-items: center; gap: 8px; }
  .auth-alt-row .alt-mid { justify-self: center; text-align: center; }
  .auth-alt-row .alt-end { justify-self: end; text-align: right; font-weight: 600; }
  .auth-alt-row select {
    width: auto;
    min-width: 132px;
    padding: 8px 32px 8px 12px;
    font-size: 0.88rem;
  }
  @media (max-width: 560px) {
    .auth-alt-row { grid-template-columns: 1fr; justify-items: center; gap: 10px; }
    .auth-alt-row .alt-left, .auth-alt-row .alt-end { justify-self: center; text-align: center; }
  }
</style>
</head>
<body>

<header id="nav" class="nav"></header>

<main class="auth">
  <section class="auth-media">
    <img src="https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&amp;fit=crop&amp;w=1400&amp;q=80"
         alt="Students learning together with a tutor" onerror="this.classList.add('img-fallback');this.removeAttribute('src');" />
    <span class="eyebrow on-dark">Welcome back</span>
    <h2>Pick up right where you left off.</h2>
    <p>
      Track your requests, manage availability, review completed sessions and keep your
      profile up to date — all from one dashboard backed by a live database.
    </p>
  </section>

  <section class="auth-panel">
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="lead">Use your TutorConnect account to continue.</p>

      <div id="formAlert"></div>

      <form id="loginForm" novalidate>
        <label class="field">
          <span class="label">Email address</span>
          <div class="input-group">
            <span class="icon-left"><i class="bi bi-envelope"></i></span>
            <input class="input has-icon" type="email" name="email" id="email" required
                   placeholder="you@example.com" autocomplete="email" />
          </div>
          <span class="field-error"></span>
        </label>

        <label class="field">
          <span class="label">Password</span>
          <div class="input-group">
            <span class="icon-left"><i class="bi bi-lock"></i></span>
            <input class="input has-icon" type="password" name="password" id="password" required
                   placeholder="Your password" autocomplete="current-password" minlength="8" />
          </div>
          <span class="field-error"></span>
        </label>

        <button class="btn btn-primary btn-lg btn-block" type="submit" id="submitBtn">Sign in</button>
      </form>

      <div class="auth-alt-row">
        <span class="alt-left">
          <select class="select" id="loginRole" aria-label="Sign in as">
            <option value="">Sign in as…</option>
            <option value="student">Student</option>
            <option value="parent">Parent</option>
            <option value="tutor">Tutor</option>
            <option value="admin">Admin</option>
          </select>
        </span>
        <span class="alt-mid">New to TutorConnect?</span>
        <a class="alt-end" href="register.html" id="createAccountLink">Create an account</a>
      </div>
    </div>
  </section>
</main>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
